[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsmooth"
version = "0.1.0"
description = "Scaled-down reproduction of arXiv:2511.19942 (Differential Smoothing) on Countdown"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "trl>=0.9",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "datasets>=2.19",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
